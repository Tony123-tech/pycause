[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycause"
version = "0.1.0"
description = "Runtime Data Provenance & Symbolic Math Engine for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TonyMic", email = "tony1225leung@gmail.com" },
]
keywords = ["provenance", "debugging", "symbolic-math", "causal-chain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://tony123-tech.github.io/pycause/"
Repository = "https://github.com/Tony123-tech/pycause"
